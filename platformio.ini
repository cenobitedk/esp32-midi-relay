; ESP32-C3 Super Mini — UART DIN-5 <-> ESP-NOW MIDI bridge
;
; Flash over the board USB-C port. Serial debug uses native USB CDC so
; GPIO20/21 stay free for the MIDI UART.
; Board profile: https://www.espboards.dev/esp32/esp32-c3-super-mini/

[env:esp32-c3-super-mini]
; pioarduino ships Arduino-ESP32 3.x (needed by ESP32_Host_MIDI ESP-NOW).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; Super Mini clones usually fail to boot in QIO; DIO matches the module flash.
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
lib_deps =
    sauloverissimo/ESP32_Host_MIDI@^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
