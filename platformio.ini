; ESP32-C3 Mini / Super Mini — UART DIN-5 <-> ESP-NOW MIDI bridge
;
; Flash over the board USB-C port. Serial debug uses native USB CDC so
; GPIO20/21 stay free for the MIDI UART.

[env:esp32-c3-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
lib_deps =
    sauloverissimo/ESP32_Host_MIDI@^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
