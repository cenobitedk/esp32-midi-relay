; DOIT ESP32 DevKit V1 — UART DIN-5 <-> ESP-NOW MIDI bridge
;
; Flash over Micro-USB (CP2102 or CH340). Serial debug uses UART0
; (GPIO1/3, wired to the USB-serial chip). MIDI uses UART2.
; Board profile: https://www.espboards.dev/esp32/esp32doit-devkit-v1/

[env:esp32doit-devkit-v1]
; pioarduino ships Arduino-ESP32 3.x (needed by ESP32_Host_MIDI ESP-NOW).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
lib_deps =
    sauloverissimo/ESP32_Host_MIDI@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
