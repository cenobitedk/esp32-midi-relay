; Seeed Studio XIAO ESP32C3 — UART DIN-5 <-> ESP-NOW
;
; Native USB-C (no USB-serial chip). USB CDC is Serial; MIDI uses UART0
; on the silk RX/TX pins (GPIO20/21). Attach the included u.FL antenna
; before judging ESP-NOW range — there is no onboard antenna.
;   https://www.espboards.dev/esp32/xiao-esp32c3/

[env:seeed-xiao-esp32c3]
; pioarduino ships Arduino-ESP32 3.x (needed by ESP32_Host_MIDI ESP-NOW).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.flash_mode = qio
lib_deps =
    sauloverissimo/ESP32_Host_MIDI@^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
