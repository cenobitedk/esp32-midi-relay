; ESP32-S3 Super Mini — UART DIN-5 <-> ESP-NOW MIDI bridge
;
; Flash over the board USB-C port. Serial debug uses native USB CDC so
; the labeled TX/RX pins (GPIO43/44) stay free for the MIDI UART.
; Board profile: https://www.espboards.dev/esp32/esp32-s3-super-mini/

[env:esp32-s3-super-mini]
; pioarduino ships Arduino-ESP32 3.x (needed by ESP32_Host_MIDI ESP-NOW).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; Typical Super Mini is ESP32-S3FH4R2: 4 MB QIO flash + 2 MB QSPI PSRAM.
; The stock esp32-s3-devkitc-1 profile is 8 MB / no PSRAM — override it.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
lib_deps =
    sauloverissimo/ESP32_Host_MIDI@^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
