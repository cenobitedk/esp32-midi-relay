; ESP32 30-pin DevKit (DOIT V1 and generic clones) — UART DIN-5 <-> ESP-NOW
;
; These boards are the same for firmware: ESP32-WROOM-32, 30 pins, PCB antenna,
; UART0 on the USB-serial chip, MIDI on UART2 (GPIO16/17).
;   https://www.espboards.dev/esp32/esp32-30pin-devkit-generic/
;   https://www.espboards.dev/esp32/esp32doit-devkit-v1/
;
; Cheap clones often fail at 921600 and need the BOOT button (see README).

[env:esp32-30pin-devkit-generic]
; pioarduino ships Arduino-ESP32 3.x (needed by ESP32_Host_MIDI ESP-NOW).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; CH340 clones commonly drop packets at 921600.
upload_speed = 115200
; CH9102X on macOS Apple CDC (/dev/cu.usbmodem*) fails the stub with
; "Failed to write to target RAM (result was 0107: Checksum error)".
; Skip the stub and talk to the ROM bootloader. After installing the WCH
; driver the port becomes /dev/cu.wchusbserial* and this can be removed.
upload_flags =
    --no-stub
monitor_filters = esp32_exception_decoder
; Leave RTS/DTR idle so the serial monitor does not hold EN/BOOT.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = dio
lib_deps =
    sauloverissimo/ESP32_Host_MIDI@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Same silicon / pinout as the generic 30-pin clone.
[env:esp32doit-devkit-v1]
extends = env:esp32-30pin-devkit-generic
